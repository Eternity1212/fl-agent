version: paper_matrix.v1

# =============================================================================
# FedNoRo baseline (Wu et al., IJCAI 2023) —— 补齐 "两阶段 + 鲁棒损失" 噪声FL SOTA 对照
# =============================================================================
# FedNoRo 与已实现的 FedA3I 的区别 (论文里要讲清楚):
#   - FedA3I : 逐样本 loss 的 GMM -> 只做质量感知"加权"
#   - FedNoRo: 预热(FedAvg) -> 客户端级平均 loss 的 GMM 分干净/脏 ->
#              脏客户端改用鲁棒损失(GCE) 训练 + 距离感知聚合(两阶段)
# 这样噪声FL 三大家族全齐: 重加权(CCR/FedA3I) / 拜占庭鲁棒(median/trimmed) / 两阶段鲁棒(FedNoRo)。
#
# 与现有 fedavg/agent/ccr/feda3i 逐 seed 可比: 同 split、同噪声、同 3 seeds。
# 覆盖 het02(轻噪) / het04 IID(重噪) / het04_dir(非IID重噪), 每条 3 seed = 9 run。
#
# 运行 (数据/split 已就绪时):
#   python3 -m fed_agent.tools.run_paper_matrix \
#     --matrix_yaml configs/paper_matrix_agent_fednoro.yaml \
#     --out_dir runs/paper_matrix/agent_fednoro
#   python3 -m fed_agent.tools.summarize_agent runs/paper_matrix/agent_fednoro/summary.json \
#     --csv runs/paper_matrix/agent_fednoro/fednoro_full.csv
# =============================================================================

dataset:
  train_labels_csv: data/raw/rfmid_full/train/labels.csv
  train_images_dir: data/raw/rfmid_full/train/images
  validation_labels_csv: data/raw/rfmid_full/validation/labels.csv
  validation_images_dir: data/raw/rfmid_full/validation/images
  eval_labels_csv: data/raw/rfmid_full/test/labels.csv
  eval_images_dir: data/raw/rfmid_full/test/images
  probe_labels_csv: data/raw/rfmid_full/validation/labels.csv
  probe_images_dir: data/raw/rfmid_full/validation/images
  split_json: configs/splits/generated/labels__iid_K4_S0.json

defaults:
  method: agent_fed
  backbone: retfound_mae_vit_large
  image_size: [224, 224]
  batch_size: 16
  epochs: 20
  rounds: 40
  local_epochs: 1
  lr: 0.001
  lora_rank: 8
  lora_alpha: 16.0
  fedprox_mu: 0.0
  device: cuda
  require_retfound: true
  loss: balanced_bce
  positive_dropout: 0.0
  train_label_noise: 0.0
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  use_data_parallel: true
  agent_aggregation: fednoro
  agent_noisy_clients: [2, 3]
  agent_client_noise: 0.4
  agent_fednoro_warmup: 5       # 阶段一: 5 轮 FedAvg 预热后再做 GMM 识别脏客户端
  agent_fednoro_gce_q: 0.7      # 脏客户端 GCE 鲁棒损失的 q (0->CE, 1->MAE)

runs:
  # --- het02 (轻噪, IID, client_noise=0.2) ---
  - { name: het02_fednoro_s0, seed: 0, agent_client_noise: 0.2, split_json: configs/splits/generated/labels__iid_K4_S0.json }
  - { name: het02_fednoro_s1, seed: 1, agent_client_noise: 0.2, split_json: configs/splits/generated/labels__iid_K4_S1.json }
  - { name: het02_fednoro_s2, seed: 2, agent_client_noise: 0.2, split_json: configs/splits/generated/labels__iid_K4_S2.json }

  # --- het04 (重噪, IID, client_noise=0.4) ---
  - { name: het04_fednoro_s0, seed: 0, split_json: configs/splits/generated/labels__iid_K4_S0.json }
  - { name: het04_fednoro_s1, seed: 1, split_json: configs/splits/generated/labels__iid_K4_S1.json }
  - { name: het04_fednoro_s2, seed: 2, split_json: configs/splits/generated/labels__iid_K4_S2.json }

  # --- het04_dir (重噪, 非IID Dirichlet a=0.1) ---
  - { name: het04_dir_fednoro_s0, seed: 0, split_json: configs/splits/generated/labels__dirichlet_a0p1_K4_S0.json }
  - { name: het04_dir_fednoro_s1, seed: 1, split_json: configs/splits/generated/labels__dirichlet_a0p1_K4_S1.json }
  - { name: het04_dir_fednoro_s2, seed: 2, split_json: configs/splits/generated/labels__dirichlet_a0p1_K4_S2.json }
